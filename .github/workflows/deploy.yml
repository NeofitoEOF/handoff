name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      release_tag:
        description: "Signed GitHub Release tag, e.g. v1.0.0"
        required: true
        type: string

permissions:
  contents: read
  packages: read

env:
  IMAGE_PREFIX: ghcr.io/neofitoeof/handoff

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p dist
          gh release download "$RELEASE_TAG" --dir dist
          test -f dist/release-manifest.json
          test -f dist/SHA256SUMS

      - name: Verify release asset checksums
        run: |
          cd dist
          sha256sum -c SHA256SUMS

      - name: Read release manifest
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          jq -e --arg tag "$RELEASE_TAG" '.tag == $tag' dist/release-manifest.json >/dev/null

          api_digest="$(jq -r '.images.api' dist/release-manifest.json)"
          worker_digest="$(jq -r '.images.worker' dist/release-manifest.json)"
          web_digest="$(jq -r '.images.web' dist/release-manifest.json)"

          for digest in "$api_digest" "$worker_digest" "$web_digest"; do
            printf '%s' "$digest" | grep -Eq '^sha256:[a-f0-9]{64}$'
          done

          chart="$(find dist -maxdepth 1 -type f -name 'handoff-*.tgz' -print -quit)"
          test -n "$chart"

          {
            echo "api_digest=$api_digest"
            echo "worker_digest=$worker_digest"
            echo "web_digest=$web_digest"
            echo "chart=$chart"
          } >> "$GITHUB_OUTPUT"

      - name: Verify signed images
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          API_DIGEST: ${{ steps.release.outputs.api_digest }}
          WORKER_DIGEST: ${{ steps.release.outputs.worker_digest }}
          WEB_DIGEST: ${{ steps.release.outputs.web_digest }}
        run: |
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${RELEASE_TAG}"
          issuer="https://token.actions.githubusercontent.com"

          cosign verify \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" \
            "${IMAGE_PREFIX}-api@${API_DIGEST}"

          cosign verify \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" \
            "${IMAGE_PREFIX}-worker@${WORKER_DIGEST}"

          cosign verify \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" \
            "${IMAGE_PREFIX}-web@${WEB_DIGEST}"

      - name: Configure kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Helm deploy signed digests
        env:
          CHART: ${{ steps.release.outputs.chart }}
          API_DIGEST: ${{ steps.release.outputs.api_digest }}
          WORKER_DIGEST: ${{ steps.release.outputs.worker_digest }}
          WEB_DIGEST: ${{ steps.release.outputs.web_digest }}
        run: |
          helm upgrade --install handoff "$CHART" \
            --namespace handoff \
            --create-namespace \
            --wait \
            --timeout 10m \
            --set domain="${{ vars.HANDOFF_DOMAIN }}" \
            --set-string images.api.digest="$API_DIGEST" \
            --set-string images.web.digest="$WEB_DIGEST" \
            --set-string images.worker.digest="$WORKER_DIGEST" \
            --set externalSecrets.enabled=true \
            --set observability.serviceMonitor.enabled="${{ vars.SERVICE_MONITOR_ENABLED || 'false' }}" \
            --set observability.prometheusRule.enabled="${{ vars.PROMETHEUS_RULE_ENABLED || 'false' }}"

      - name: Rollout status
        run: |
          kubectl -n handoff rollout status deploy/handoff-api --timeout=5m
          kubectl -n handoff rollout status deploy/handoff-web --timeout=5m
          kubectl -n handoff rollout status deploy/handoff-worker --timeout=5m

      - name: Confirm running image digests
        env:
          API_DIGEST: ${{ steps.release.outputs.api_digest }}
          WORKER_DIGEST: ${{ steps.release.outputs.worker_digest }}
          WEB_DIGEST: ${{ steps.release.outputs.web_digest }}
        run: |
          kubectl -n handoff get deploy handoff-api -o jsonpath='{.spec.template.spec.containers[0].image}' | grep -F "@$API_DIGEST"
          kubectl -n handoff get deploy handoff-worker -o jsonpath='{.spec.template.spec.containers[0].image}' | grep -F "@$WORKER_DIGEST"
          kubectl -n handoff get deploy handoff-web -o jsonpath='{.spec.template.spec.containers[0].image}' | grep -F "@$WEB_DIGEST"

      - name: Deployment smoke
        env:
          API_URL: ${{ vars.SMOKE_API_URL }}
          WEB_URL: ${{ vars.SMOKE_WEB_URL }}
          SMOKE_SUBDOMAIN: ${{ vars.STAGING_SMOKE_SUBDOMAIN }}
          SMOKE_EMAIL: ${{ secrets.STAGING_SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
          SMOKE_OTP: ${{ secrets.STAGING_SMOKE_OTP }}
        run: sh scripts/smoke-deploy.sh
