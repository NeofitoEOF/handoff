name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/neofitoeof/handoff

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Prepare tag
        id: meta
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Validate release metadata
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: node scripts/check-release.mjs

      - name: Render release notes
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          awk -v "heading=## [$version]" '
            $0 == heading || index($0, heading " - ") == 1 {capture=1; next}
            capture && /^## \[/ {exit}
            capture {print}
          ' CHANGELOG.md > dist-release-notes.md
          test -s dist-release-notes.md

      - name: Build and push API
        id: api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ env.IMAGE_PREFIX }}-api:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}

      - name: Sign API image
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}-api
          DIGEST: ${{ steps.api.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Build and push worker
        id: worker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ env.IMAGE_PREFIX }}-worker:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}-worker:${{ github.sha }}

      - name: Sign worker image
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}-worker
          DIGEST: ${{ steps.worker.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Build and push web
        id: web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          sbom: true
          provenance: mode=max
          build-args: |
            VITE_API_URL=https://api.${{ vars.HANDOFF_DOMAIN }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-web:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}

      - name: Sign web image
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}-web
          DIGEST: ${{ steps.web.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Write release manifest
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          mkdir -p dist
          jq -n \
            --arg tag "$TAG" \
            --arg commit "${GITHUB_SHA}" \
            --arg api "$API_DIGEST" \
            --arg worker "$WORKER_DIGEST" \
            --arg web "$WEB_DIGEST" \
            '{
              tag: $tag,
              commit: $commit,
              images: {
                api: $api,
                worker: $worker,
                web: $web
              }
            }' > dist/release-manifest.json

      - name: Verify image signatures
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${RELEASE_TAG}"
          issuer="https://token.actions.githubusercontent.com"

          cosign verify --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" "${IMAGE_PREFIX}-api@${API_DIGEST}"
          cosign verify --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" "${IMAGE_PREFIX}-worker@${WORKER_DIGEST}"
          cosign verify --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" "${IMAGE_PREFIX}-web@${WEB_DIGEST}"

      - uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Package chart
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          helm lint infra/helm/handoff
          version="${TAG#v}"
          helm package infra/helm/handoff \
            --version "$version" \
            --app-version "$TAG" \
            --destination dist

      - name: Create release checksums
        run: |
          cd dist
          chart="$(find . -maxdepth 1 -type f -name 'handoff-*.tgz' -print -quit)"
          test -n "$chart"
          sha256sum release-manifest.json "$chart" > SHA256SUMS

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: handoff-release-${{ steps.meta.outputs.tag }}
          path: |
            dist/*.tgz
            dist/release-manifest.json
            dist/SHA256SUMS
          retention-days: 90

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          chart="$(find dist -maxdepth 1 -type f -name 'handoff-*.tgz' -print -quit)"
          test -n "$chart"

          gh release create "$TAG" \
            dist/release-manifest.json \
            dist/SHA256SUMS \
            "$chart" \
            --verify-tag \
            --notes-file dist-release-notes.md \
            --title "$TAG"
