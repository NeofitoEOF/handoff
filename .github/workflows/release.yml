name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/handoff

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare tag
        id: meta
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-api:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}

      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-worker:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}-worker:${{ github.sha }}

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=https://api.${{ vars.HANDOFF_DOMAIN }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-web:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}

      - uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Package chart
        run: |
          helm lint infra/helm/handoff
          helm package infra/helm/handoff --destination dist

      - name: Upload chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: handoff-helm-${{ steps.meta.outputs.tag }}
          path: dist/*.tgz
