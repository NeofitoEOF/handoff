name: DAST

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL base do ambiente de staging"
        required: true
        type: string
  schedule:
    - cron: "11 8 * * 3"

permissions:
  contents: read

jobs:
  zap-baseline:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.STAGING_BASE_URL != '' }}
    runs-on: ubuntu-latest
    env:
      TARGET_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.target_url || vars.STAGING_BASE_URL }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate target
        run: |
          case "$TARGET_URL" in
            https://*) ;;
            *) echo "TARGET_URL must use https://" >&2; exit 2 ;;
          esac

      - name: OWASP ZAP baseline
        run: |
          mkdir -p zap-output
          docker run --rm             -v "$PWD/zap-output:/zap/wrk/:rw"             ghcr.io/zaproxy/zaproxy:stable             zap-baseline.py               -t "$TARGET_URL"               -r zap-report.html               -J zap-report.json               -w zap-report.md               -I

      - name: Upload DAST report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-dast-report
          path: zap-output/
          retention-days: 30
