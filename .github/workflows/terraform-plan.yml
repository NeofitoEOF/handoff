name: Terraform Plan

on:
  pull_request:
    paths:
      - "infra/terraform/oci/**"
      - ".github/workflows/terraform-plan.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  plan:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.OCI_TERRAFORM_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: infra/terraform/oci
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_region: ${{ vars.OCI_REGION }}
      TF_VAR_home_region: ${{ vars.OCI_HOME_REGION }}
      TF_VAR_tenancy_id: ${{ secrets.OCI_TENANCY_ID }}
      TF_VAR_compartment_id: ${{ secrets.OCI_COMPARTMENT_ID }}
      TF_VAR_postgres_subnet_id: ${{ secrets.OCI_POSTGRES_SUBNET_ID }}
      TF_VAR_postgres_admin_password: ${{ secrets.OCI_POSTGRES_ADMIN_PASSWORD }}
      TF_VAR_postgres_db_version: ${{ vars.OCI_POSTGRES_VERSION }}
      TF_VAR_postgres_system_type: ${{ vars.OCI_POSTGRES_SYSTEM_TYPE }}
      TF_VAR_postgres_storage_system_type: ${{ vars.OCI_POSTGRES_STORAGE_SYSTEM_TYPE }}
      OCI_STATE_BUCKET: ${{ vars.OCI_STATE_BUCKET }}
      OCI_OBJECT_STORAGE_NAMESPACE: ${{ vars.OCI_OBJECT_STORAGE_NAMESPACE }}
      OCI_REGION: ${{ vars.OCI_REGION }}
      TF_STATE_KEY: handoff/staging/terraform.tfstate
      AWS_ACCESS_KEY_ID: ${{ secrets.OCI_STATE_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_STATE_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Configure OCI credentials
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
        run: |
          mkdir -p "$HOME/.oci"
          printf '%s' "$OCI_PRIVATE_KEY" > "$HOME/.oci/oci_api_key.pem"
          chmod 600 "$HOME/.oci/oci_api_key.pem"
          printf '[DEFAULT]\nuser=%s\nfingerprint=%s\ntenancy=%s\nregion=%s\nkey_file=%s/.oci/oci_api_key.pem\n' \
            "$OCI_USER_OCID" "$OCI_FINGERPRINT" "$TF_VAR_tenancy_id" "$TF_VAR_region" "$HOME" > "$HOME/.oci/config"

      - name: Terraform init
        run: sh ../../../scripts/terraform-init-oci-state.sh

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -no-color -out=tfplan

      - name: Render plan
        run: terraform show -no-color tfplan > tfplan.txt

      - uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: infra/terraform/oci/tfplan.txt
          retention-days: 14

      - name: Publish plan summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/terraform/oci/tfplan.txt', 'utf8');
            const body = '### Terraform plan (staging)\n\n' + plan.slice(0, 60000);
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
