name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: handoff_admin
          POSTGRES_PASSWORD: handoff_admin
          POSTGRES_DB: handoff
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U handoff_admin -d handoff"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://handoff_app:handoff_app@localhost:5432/handoff
      MIGRATION_DATABASE_URL: postgres://handoff_admin:handoff_admin@localhost:5432/handoff
      APP_DATABASE_USER: handoff_app
      APP_DATABASE_PASSWORD: handoff_app

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @handoff/api migrate
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm -r build

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t handoff-api:ci .

      - name: Build worker image
        run: docker build -f apps/worker/Dockerfile -t handoff-worker:ci .

      - name: Build web image
        run: docker build -f apps/web/Dockerfile --build-arg VITE_API_URL=http://localhost:3000 -t handoff-web:ci .

      - uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Lint Helm chart
        run: helm lint infra/helm/handoff

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform fmt
        run: terraform -chdir=infra/terraform/oci fmt -check -diff

      - name: Terraform validate
        run: |
          terraform -chdir=infra/terraform/oci init -backend=false
          terraform -chdir=infra/terraform/oci validate

      - name: Restore smoke test
        run: sh scripts/restore-smoke.sh
