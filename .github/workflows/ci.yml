name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: handoff_admin
          POSTGRES_PASSWORD: handoff_admin
          POSTGRES_DB: handoff
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U handoff_admin -d handoff"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://handoff_app:handoff_app@localhost:5432/handoff
      MIGRATION_DATABASE_URL: postgres://handoff_admin:handoff_admin@localhost:5432/handoff
      APP_DATABASE_USER: handoff_app
      APP_DATABASE_PASSWORD: handoff_app

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lock-${{ github.sha }}
          path: pnpm-lock.yaml
          retention-days: 3
      - run: pnpm --filter @handoff/api migrate
      - name: Validate shell scripts
        run: |
          for file in scripts/*.sh; do
            sh -n "$file"
          done

      - name: Validate GitHub Actions
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12

      - name: Check migration safety
        run: node scripts/check-migrations.mjs

      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm -r build

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t handoff-api:ci .

      - name: Build worker image
        run: docker build -f apps/worker/Dockerfile -t handoff-worker:ci .

      - name: Build web image
        run: docker build -f apps/web/Dockerfile --build-arg VITE_API_URL=http://localhost:3000 -t handoff-web:ci .

      - uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Lint Helm chart
        run: helm lint infra/helm/handoff

      - name: Verify Helm digest rendering
        run: |
          api_digest="sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          worker_digest="sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
          web_digest="sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc"

          helm template handoff infra/helm/handoff \
            --set-string images.api.digest="$api_digest" \
            --set-string images.worker.digest="$worker_digest" \
            --set-string images.web.digest="$web_digest" \
            > /tmp/handoff-rendered.yaml

          test "$(grep -Fc "ghcr.io/neofitoeof/handoff-api@$api_digest" /tmp/handoff-rendered.yaml)" -ge 2
          grep -Fq "ghcr.io/neofitoeof/handoff-worker@$worker_digest" /tmp/handoff-rendered.yaml
          grep -Fq "ghcr.io/neofitoeof/handoff-web@$web_digest" /tmp/handoff-rendered.yaml

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform fmt
        run: terraform -chdir=infra/terraform/oci fmt -check -diff

      - name: Terraform validate
        run: |
          terraform -chdir=infra/terraform/oci init -backend=false
          terraform -chdir=infra/terraform/oci validate

      - name: Restore smoke test
        run: sh scripts/restore-smoke.sh


  local-e2e:
    name: local staging e2e
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: pnpm install --no-frozen-lockfile

      - name: Validate compose
        run: docker compose -f docker-compose.staging.yml config >/dev/null

      - name: Start local staging stack
        run: docker compose -f docker-compose.staging.yml up -d --build

      - name: Run end-to-end business flow
        run: sh scripts/e2e-local.sh

      - name: Dump container status
        if: always()
        run: docker compose -f docker-compose.staging.yml ps

      - name: Collect logs on failure
        if: failure()
        run: docker compose -f docker-compose.staging.yml logs --no-color > local-e2e.log

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: local-e2e-logs
          path: local-e2e.log
          retention-days: 14

      - name: Shutdown stack
        if: always()
        run: docker compose -f docker-compose.staging.yml down -v --remove-orphans
