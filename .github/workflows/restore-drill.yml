name: Backup Restore Drill

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 1 * *"

jobs:
  restore-drill:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: handoff_admin
          POSTGRES_PASSWORD: handoff_admin
          POSTGRES_DB: handoff
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U handoff_admin -d handoff"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://handoff_app:handoff_app@localhost:5432/handoff
      MIGRATION_DATABASE_URL: postgres://handoff_admin:handoff_admin@localhost:5432/handoff
      APP_DATABASE_USER: handoff_app
      APP_DATABASE_PASSWORD: handoff_app

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @handoff/api migrate

      - name: Seed restore marker
        run: |
          docker run --rm --network host             -e PGPASSWORD=handoff_admin postgres:16-alpine             psql -h 127.0.0.1 -U handoff_admin -d handoff -v ON_ERROR_STOP=1             -c "INSERT INTO tenants (name, subdomain) VALUES ('Restore Drill', 'restore-drill');"

      - name: Create backup
        run: |
          docker run --rm --network host -e PGPASSWORD=handoff_admin postgres:16-alpine \
            pg_dump -h 127.0.0.1 -U handoff_admin -d handoff -Fc > /tmp/handoff.dump
          test -s /tmp/handoff.dump

      - name: Create restore target
        run: |
          docker run --rm --network host             -e PGPASSWORD=handoff_admin postgres:16-alpine             psql -h 127.0.0.1 -U handoff_admin -d postgres -v ON_ERROR_STOP=1             -c "CREATE DATABASE handoff_restore;"

      - name: Restore archive
        run: |
          cat /tmp/handoff.dump | docker run --rm -i --network host             -e PGPASSWORD=handoff_admin postgres:16-alpine             pg_restore -h 127.0.0.1 -U handoff_admin -d handoff_restore               --no-owner --no-privileges

      - name: Verify restored data
        run: |
          docker run --rm --network host             -e PGPASSWORD=handoff_admin postgres:16-alpine             psql -h 127.0.0.1 -U handoff_admin -d handoff_restore               -v ON_ERROR_STOP=1               -c "SELECT 1 FROM tenants WHERE subdomain='restore-drill';"               -c "SELECT count(*) FROM schema_migrations;"
