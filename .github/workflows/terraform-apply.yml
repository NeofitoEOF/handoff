name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to provision"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      confirm:
        description: "Type APPLY to confirm"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    if: ${{ inputs.confirm == 'APPLY' && vars.OCI_TERRAFORM_REMOTE_STATE_READY == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: infra/terraform/oci
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_region: ${{ vars.OCI_REGION }}
      TF_VAR_home_region: ${{ vars.OCI_HOME_REGION }}
      TF_VAR_tenancy_id: ${{ secrets.OCI_TENANCY_ID }}
      TF_VAR_compartment_id: ${{ secrets.OCI_COMPARTMENT_ID }}
      TF_VAR_postgres_subnet_id: ${{ secrets.OCI_POSTGRES_SUBNET_ID }}
      TF_VAR_postgres_admin_password: ${{ secrets.OCI_POSTGRES_ADMIN_PASSWORD }}
      TF_VAR_postgres_db_version: ${{ vars.OCI_POSTGRES_VERSION }}
      TF_VAR_postgres_system_type: ${{ vars.OCI_POSTGRES_SYSTEM_TYPE }}
      TF_VAR_postgres_storage_system_type: ${{ vars.OCI_POSTGRES_STORAGE_SYSTEM_TYPE }}
      TF_VAR_waf_enabled: ${{ vars.OCI_WAF_ENABLED || 'false' }}
      TF_VAR_waf_load_balancer_id: ${{ vars.OCI_WAF_LOAD_BALANCER_ID || '' }}
      OCI_STATE_BUCKET: ${{ vars.OCI_STATE_BUCKET }}
      OCI_OBJECT_STORAGE_NAMESPACE: ${{ vars.OCI_OBJECT_STORAGE_NAMESPACE }}
      OCI_REGION: ${{ vars.OCI_REGION }}
      TF_STATE_KEY: handoff/${{ inputs.environment }}/terraform.tfstate
      AWS_ACCESS_KEY_ID: ${{ secrets.OCI_STATE_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_STATE_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Configure OCI credentials
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
        run: |
          mkdir -p "$HOME/.oci"
          printf '%s' "$OCI_PRIVATE_KEY" > "$HOME/.oci/oci_api_key.pem"
          chmod 600 "$HOME/.oci/oci_api_key.pem"
          printf '[DEFAULT]\nuser=%s\nfingerprint=%s\ntenancy=%s\nregion=%s\nkey_file=%s/.oci/oci_api_key.pem\n' \
            "$OCI_USER_OCID" "$OCI_FINGERPRINT" "$TF_VAR_tenancy_id" "$TF_VAR_region" "$HOME" > "$HOME/.oci/config"

      - name: Terraform init
        run: sh ../../../scripts/terraform-init-oci-state.sh
      - run: terraform plan -no-color -out=tfplan
      - run: terraform apply -auto-approve tfplan
      - name: Export outputs
        run: terraform output -json > outputs.json
      - uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs-${{ inputs.environment }}
          path: infra/terraform/oci/outputs.json
          retention-days: 7
