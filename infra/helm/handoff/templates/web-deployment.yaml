apiVersion: apps/v1
kind: Deployment
metadata:
  name: handoff-web
  labels:
    {{- include "handoff.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.replicas.web }}
  selector:
    matchLabels:
      app.kubernetes.io/name: handoff
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: handoff
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: "{{ .Values.images.web.repository }}{{ if .Values.images.web.digest }}@{{ .Values.images.web.digest }}{{ else }}:{{ .Values.images.web.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.images.web.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.webPort }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            {{- toYaml .Values.resources.web | nindent 12 }}
          volumeMounts:
            - name: nginx-tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: nginx-tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
