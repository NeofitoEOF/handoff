apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: handoff-default-deny-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: handoff
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: handoff-api-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: handoff
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingress.namespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingress.podSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.apiPort }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: handoff-web-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: handoff
      app.kubernetes.io/component: web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingress.namespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingress.podSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.webPort }}
