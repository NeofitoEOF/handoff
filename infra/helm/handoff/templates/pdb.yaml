apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: handoff-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: handoff
      app.kubernetes.io/component: api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: handoff-web
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: handoff
      app.kubernetes.io/component: web
